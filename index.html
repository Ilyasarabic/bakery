<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17402f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c2a1e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Пекарня</title>
</head>
<body>
<header>
  <div>
    <p id="today"></p>
    <h1 id="title">Заказы</h1>
  </div>
  <button id="btn-settings" type="button" aria-label="Настройки"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>

<main>
  <section id="view-orders" class="view">
    <div class="receipt-wrap">
      <div class="receipt">
        <div class="rc-head"><b>Касса дня</b><span id="rc-date"></span></div>
        <div class="rc-row"><span>Выручка</span><b id="h-rev">0</b></div>
        <div class="rc-row"><span>Себестоимость</span><b id="h-cost">0</b></div>
        <div class="rc-row"><span>Булок сдано</span><b id="h-qty">0</b></div>
        <div class="rc-total"><span>Прибыль</span><strong id="h-profit">0</strong></div>
      </div>
    </div>
    <label for="o-date">Дата</label>
    <input id="o-date" type="date">
    <label for="o-point">Точка</label>
    <select id="o-point"></select>
    <label for="o-prod">Хлеб</label>
    <select id="o-prod"></select>
    <label for="o-qty">Количество</label>
    <input id="o-qty" type="text" inputmode="decimal" autocomplete="off">
    <div id="o-preview"></div>
    <button id="btn-order" type="button" class="primary">Сдать заказ</button>
    <p id="order-status" role="status"></p>
    <h2>Заказы за день</h2>
    <div id="o-list"></div>
  </section>
  <section id="view-raw" class="view">
    <div id="raw-list"></div>

    <details class="panel">
      <summary>Записать закупку</summary>
      <label for="p-raw">Что купили</label>
      <select id="p-raw"></select>
      <label for="p-qty">Количество</label>
      <input id="p-qty" type="text" inputmode="decimal" autocomplete="off">
      <label for="p-sum">Сколько заплатили всего</label>
      <input id="p-sum" type="text" inputmode="decimal" autocomplete="off">
      <p id="p-hint" class="sub"></p>
      <label for="p-supplier">Поставщик (необязательно)</label>
      <input id="p-supplier" type="text" autocomplete="off">
      <button id="btn-purchase" type="button" class="primary">Записать закупку</button>
    </details>

    <details class="panel">
      <summary>Добавить новое сырьё</summary>
      <label for="n-name">Название</label>
      <input id="n-name" type="text" autocomplete="off" placeholder="Мука «Терек»">
      <label for="n-unit">Единица измерения</label>
      <select id="n-unit"><option>кг</option><option>л</option><option>шт</option></select>
      <label for="n-min">Когда напомнить докупить (остаток ниже)</label>
      <input id="n-min" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      <button id="btn-newraw" type="button" class="primary">Добавить сырьё</button>
    </details>
    <p id="raw-status" role="status"></p>
  </section>
  <section id="view-products" class="view">
    <div id="prod-list"></div>

    <details class="panel" id="prod-panel">
      <summary id="prod-summary">Добавить хлеб</summary>
      <input type="hidden" id="pr-id">
      <label for="pr-name">Название</label>
      <input id="pr-name" type="text" autocomplete="off" placeholder="Чиабатта">
      <label for="pr-weight">Вес одной булки, г</label>
      <input id="pr-weight" type="text" inputmode="decimal" autocomplete="off">
      <label for="pr-price">Цена продажи за булку</label>
      <input id="pr-price" type="text" inputmode="decimal" autocomplete="off">
      <label for="pr-mix">Сколько булок получается из одного замеса</label>
      <input id="pr-mix" type="text" inputmode="decimal" autocomplete="off">
      <label>Рецепт на один замес</label>
      <div id="pr-lines"></div>
      <button id="btn-addline" type="button" class="ghost">+ Ингредиент</button>
      <button id="btn-saveprod" type="button" class="primary">Сохранить хлеб</button>
      <button id="btn-cancelprod" type="button" class="ghost">Отмена</button>
    </details>

    <details class="panel">
      <summary>Калькулятор граммовок</summary>
      <label for="c-prod">Хлеб</label>
      <select id="c-prod"></select>
      <label for="c-n">Сколько булок</label>
      <input id="c-n" type="text" inputmode="decimal" autocomplete="off">
      <div id="c-out"></div>
    </details>
    <p id="prod-status" role="status"></p>
  </section>
  <section id="view-points" class="view">
    <div id="pt-list"></div>
    <details class="panel" id="pt-panel">
      <summary id="pt-summary">Добавить точку</summary>
      <input type="hidden" id="pt-id">
      <label for="pt-name">Название</label>
      <input id="pt-name" type="text" autocomplete="off" placeholder="Магазин «Продукты»">
      <label for="pt-village">Село</label>
      <input id="pt-village" type="text" autocomplete="off">
      <label for="pt-phone">Телефон</label>
      <input id="pt-phone" type="text" inputmode="tel" autocomplete="off">
      <label for="pt-note">Заметка</label>
      <input id="pt-note" type="text" autocomplete="off">
      <button id="btn-savept" type="button" class="primary">Сохранить точку</button>
      <button id="btn-cancelpt" type="button" class="ghost">Отмена</button>
    </details>
    <p id="pt-status" role="status"></p>
  </section>
  <section id="view-finance" class="view">
    <p class="stub">Здесь будут выручка, себестоимость и прибыль.</p>
  </section>

  <section id="view-settings" class="view">
    <label for="api-url">Адрес скрипта (Web app URL)</label>
    <input id="api-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="api-key">Ключ доступа</label>
    <input id="api-key" type="password" autocomplete="off">
    <div class="row">
      <button id="btn-save" type="button" class="primary">Сохранить</button>
      <button id="btn-check" type="button">Проверить связь</button>
    </div>
    <p id="status" role="status"></p>
  </section>
</main>

<nav>
  <button type="button" data-view="orders"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l2 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7l2-4Z"/><path d="M4 7h16"/><path d="M9 11a3 3 0 0 0 6 0"/></svg></i><span>Заказы</span></button>
  <button type="button" data-view="raw"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></i><span>Сырьё</span></button>
  <button type="button" data-view="products"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1a2 2 0 0 1-1 1.7V18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-4.3A2 2 0 0 1 5 12v-1Z"/><path d="m10 10-1 3M14 10l-1 3"/></svg></i><span>Ассортимент</span></button>
  <button type="button" data-view="points"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></i><span>Точки</span></button>
  <button type="button" data-view="finance"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg></i><span>Финансы</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
